<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Inroads (Copy)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<style>
/* Layout: phone-first single column under a sticky brand bar; the bottom tab bar becomes a left rail at 900px+; every record opens in a sliding sheet */
:root{
  --bg:#EDEFF5; --surface:#FFFFFF; --sunk:#F4F5F9; --ink:#121726; --muted:#586077; --faint:#8C92A5; --line:#DADEE8;
  --accent:#2B44C8; --accent-ink:#FFFFFF; --accent-soft:#E3E7FA;
  --hot:#D94B31; --warm:#DB8B22; --cool:#5585C2; --cold:#9AA1B2; --fresh:#7A68D3;
  --good:#16865A; --warn:#A36600; --bad:#C23A30;
  --scrim:rgb(10 13 22 / .45);
  --shadow:0 1px 2px rgb(18 23 38 / .06), 0 12px 28px -14px rgb(18 23 38 / .22);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:16px; --r-sm:11px; --rail:88px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1017; --surface:#161A24; --sunk:#1C2130; --ink:#E8EBF3; --muted:#A1A8BB; --faint:#6E7589; --line:#2A3144;
    --accent:#8A99FF; --accent-ink:#0D1017; --accent-soft:#232A52;
    --hot:#F2694F; --warm:#F0AA45; --cool:#80A9DD; --cold:#6E7589; --fresh:#A595F0;
    --good:#41C08B; --warn:#E6A73C; --bad:#EF6B60;
    --scrim:rgb(0 0 0 / .6);
    --shadow:0 1px 2px rgb(0 0 0 / .3), 0 12px 28px -14px rgb(0 0 0 / .6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1017; --surface:#161A24; --sunk:#1C2130; --ink:#E8EBF3; --muted:#A1A8BB; --faint:#6E7589; --line:#2A3144;
  --accent:#8A99FF; --accent-ink:#0D1017; --accent-soft:#232A52;
  --hot:#F2694F; --warm:#F0AA45; --cool:#80A9DD; --cold:#6E7589; --fresh:#A595F0;
  --good:#41C08B; --warn:#E6A73C; --bad:#EF6B60;
  --scrim:rgb(0 0 0 / .6);
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 12px 28px -14px rgb(0 0 0 / .6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.012em}
h1{font-size:clamp(28px,7vw,40px);line-height:1.06;font-weight:720}
h2{font-size:19px;line-height:1.25;font-weight:660}
h3{font-size:16px;line-height:1.3;font-weight:650}
h4{font-size:13px;font-weight:650;letter-spacing:.01em}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* chrome */
#app{min-height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:960px;margin:0 auto;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:9px;font:760 20px/1 var(--f-display);letter-spacing:-.02em}
.brand svg{width:26px;height:26px;fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linecap:round}
.status i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status.ok i{background:var(--good)} .status.warn i{background:var(--warn)}
main#view{max-width:960px;margin:0 auto;padding-block:4px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;color:var(--faint);font:600 11px/1 var(--f-body);letter-spacing:.01em;border-radius:12px}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
@media (min-width:900px){
  #app{padding-left:var(--rail)}
  .tabs{top:0;right:auto;width:var(--rail);grid-template-columns:1fr;grid-auto-rows:min-content;align-content:start;gap:6px;border-top:0;border-right:1px solid var(--line);padding-top:calc(env(safe-area-inset-top,0px) + 76px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:8px}
  .tabs button{padding:12px 4px}
  main#view{padding-bottom:64px}
}

/* type helpers */
.stamp{font:500 11.5px/1.2 var(--f-mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.lede{color:var(--muted);font-size:15.5px;max-width:60ch}
.sub{color:var(--muted);font-size:13.5px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:14.5px;padding:14px;border:1px dashed var(--line);border-radius:var(--r-sm);background:var(--sunk)}
.hint{display:block;color:var(--faint);font-size:12.5px;margin-top:6px}
.err{color:var(--bad);font-size:14px;font-weight:550}
.why{font-size:14px;color:var(--muted);max-width:62ch}

/* layout blocks */
.hero{display:grid;gap:10px;padding-block:18px 14px}
.hero.tight{padding-bottom:6px}
.block{display:grid;gap:12px;padding-block:22px 6px}
.block-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.block-h h2{display:flex;align-items:center;gap:10px}
.count{font:500 12px/1 var(--f-mono);color:var(--muted);background:var(--sunk);border:1px solid var(--line);border-radius:99px;padding:4px 8px}
.actions-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px/1 var(--f-body);cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--faint)}
.btn:active{transform:translateY(1px)}
.btn.small{min-height:34px;padding:0 12px;font-size:13px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,var(--ink))}
.btn.quiet{background:transparent}
.btn.danger{background:var(--bad);color:#fff;border-color:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:14px}
.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.link.danger{color:var(--bad)}
.icon-btn{all:unset;cursor:pointer;width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-size:18px;flex:none}
.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon-btn[aria-pressed="true"]{color:var(--warm);border-color:var(--warm)}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;justify-self:start;max-width:100%;overflow-x:auto}
.seg button{all:unset;cursor:pointer;padding:7px 14px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .1)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{all:unset;cursor:pointer;flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:550;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=search],input[type=url],input[type=email],input[type=tel],input[type=date],input[type=time],input[type=number],input:not([type]),select,textarea{width:100%;min-height:44px;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-size:16px;line-height:1.35}
textarea{resize:vertical;min-height:84px}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:0;border-color:var(--accent)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px}
.toolbar select{width:auto}

/* avatars, pills */
.av{--ring:var(--cold);flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--ink);font:650 14px/1 var(--f-display);box-shadow:0 0 0 2px var(--surface),0 0 0 4.5px var(--ring);margin:4px}
.av.sm{width:32px;height:32px;font-size:12px;margin:3px}
.av.lg{width:64px;height:64px;font-size:22px;margin:5px}
.w-hot{--ring:var(--hot)} .w-warm{--ring:var(--warm)} .w-cool{--ring:var(--cool)} .w-cold{--ring:var(--cold)} .w-fresh{--ring:var(--fresh)}
.score{font:600 12.5px/1 var(--f-mono);font-variant-numeric:tabular-nums;padding:5px 7px;border-radius:7px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.score.hi{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:550;padding:4px 9px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--ring)}
.tag.goal{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.tag.ex{border-style:dashed}

/* today */
.onboard{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:grid;gap:12px;margin-top:6px}
.steps{margin:0;padding-left:20px;display:grid;gap:4px;color:var(--muted);font-size:14.5px}
.agenda{list-style:none;margin:0;padding:0}
.ag{display:grid;grid-template-columns:70px minmax(0,1fr);gap:12px;padding-block:14px;border-top:1px dashed var(--line)}
.ag:first-child{border-top:0;padding-top:4px}
.ag-time{font:600 13px/1.4 var(--f-mono);color:var(--accent);padding-top:2px}
.ag-body{min-width:0;display:grid;gap:8px;justify-items:start}
.ag-title{all:unset;cursor:pointer;font:650 17px/1.3 var(--f-display)}
.ag-title:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.prep{display:grid;gap:8px;width:100%}
.prep-p{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
.prep-b{min-width:0;display:grid;gap:3px}
.name-link{all:unset;cursor:pointer;font-weight:650}
.name-link:focus-visible{outline:2px solid var(--accent)}
.tps{margin:2px 0 0;padding-left:18px;font-size:14px;display:grid;gap:2px}
.owed{font-size:13px;color:var(--warn);font-weight:600}
.ai-brief{display:grid;gap:10px;justify-items:start;padding-top:6px}
.prose{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;display:grid;gap:8px;max-width:70ch;width:100%}
.prose h4{font-size:15px;margin-top:6px}
.prose ul{margin:0;padding-left:18px;display:grid;gap:3px}
.ai-foot{display:flex;gap:14px;align-items:center}
.feed{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.nudge{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:grid;gap:12px;align-content:start}
.nudge-k{display:inline-flex;align-items:center;gap:7px;font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.nudge-k i{width:8px;height:8px;border-radius:2px;background:var(--nk)}
.k-cold{--nk:var(--cool)} .k-birthday{--nk:var(--fresh)} .k-promise{--nk:var(--warn)} .k-context{--nk:var(--faint)} .k-research{--nk:var(--accent)} .k-event{--nk:var(--good)} .k-goal{--nk:var(--hot)}
.nudge-main{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}
.nudge-main.solo{grid-template-columns:minmax(0,1fr)}
.nudge-main p{color:var(--muted);font-size:14px;margin-top:3px}
.nudge .actions-row{gap:6px}
.wk-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.wk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.wk.full{grid-column:1/-1}
.mini-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mini-list li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.mini-list .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt{font:600 12px/1 var(--f-mono);color:var(--muted);width:52px}
.meter{display:grid;gap:6px}
.meter-top{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.meter-bar{height:8px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);overflow:hidden}
.meter-bar span{display:block;height:100%;background:var(--accent);border-radius:99px}

/* lists */
.list{display:grid;background:var(--surface);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.row-main{min-width:0;display:grid;gap:1px}
.row-name{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{color:var(--muted);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-end{display:grid;justify-items:end;gap:4px}
.ago{font:500 12px/1 var(--f-mono);color:var(--faint)}
.date-tile{width:46px;height:50px;border-radius:10px;background:var(--sunk);border:1px solid var(--line);display:grid;place-content:center;text-align:center;line-height:1}
.date-tile b{font:700 18px/1 var(--f-display)}
.date-tile i{font:500 10.5px/1.4 var(--f-mono);font-style:normal;text-transform:uppercase;color:var(--muted)}
.kind{font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);padding-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--ring)}
.more-note{font-size:13px;color:var(--muted);padding:10px 14px;border-top:1px solid var(--line)}

/* busy */
.busy{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;background:var(--accent-soft);color:var(--ink);padding:10px 14px;border-radius:var(--r-sm)}
.busy .chars{color:var(--muted);font-family:var(--f-mono);font-size:12.5px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 25%,transparent);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* discover */
.decoder{display:grid;gap:10px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.search-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
details.more summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ "}
details.more[open] summary::before{content:"– "}
details.more textarea{margin-top:8px}
.result{display:grid;gap:14px}
.res-head{display:grid;gap:6px}
.res-sec{display:grid;gap:8px}
.res-sec>h3{font-size:14px;font-family:var(--f-mono);font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.cards{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;display:grid;gap:6px;align-content:start;min-width:0}
.mini p{font-size:14px;color:var(--muted)}
.mini .first{color:var(--ink)}
.in-net{font:500 11px/1 var(--f-mono);color:var(--good);letter-spacing:.05em;text-transform:uppercase}
.plain-list{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14.5px}
.foot-note{font-size:13px;color:var(--muted)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:60}
.backdrop{position:absolute;inset:0;background:var(--scrim)}
.backdrop.enter{animation:fade .2s ease}
.panel{position:absolute;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top,0px) + 26px);background:var(--bg);border-radius:20px 20px 0 0;overflow-y:auto;overscroll-behavior:contain;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.panel.enter{animation:rise .26s cubic-bezier(.2,.8,.2,1)}
@media (min-width:900px){.panel{left:auto;top:0;width:min(620px,100%);border-radius:0;padding-top:env(safe-area-inset-top,0px)}.panel.enter{animation:slide .26s cubic-bezier(.2,.8,.2,1)}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(40px);opacity:.6}}
@keyframes slide{from{transform:translateX(40px);opacity:.6}}
.sh{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px 10px}
.sh-t{flex:1;min-width:0;font:650 16px/1.2 var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{display:grid;gap:18px}
.ch{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.ch-t{min-width:0;display:grid;gap:6px}
.big{font-size:26px;font-weight:720;line-height:1.1}
.sec{display:grid;gap:10px;padding-top:16px;border-top:1px solid var(--line)}
.sec>h3{font:500 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.timeline{list-style:none;margin:0;padding:0;display:grid}

.timeline .d{font:600 12px/1.5 var(--f-mono);color:var(--muted)}
.timeline .ty{font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-left:6px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.check{all:unset;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;font-size:14.5px;width:100%}
.check .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--faint);margin-top:1px;display:grid;place-items:center}
.check.on .box{background:var(--good);border-color:var(--good)}
.check.on .box::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.check.on>span:last-child{color:var(--muted);text-decoration:line-through}
.check:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* forms */
form.sheet-form{display:grid;gap:16px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f{display:grid;gap:6px;min-width:0}

fieldset{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;margin:0;display:grid;gap:10px;min-width:0}
legend{font-size:13px;font-weight:650;color:var(--muted);padding:0 6px}
.checklist{display:grid;gap:2px;max-height:240px;overflow-y:auto}
.checklist label{display:flex;gap:10px;align-items:center;padding:6px 4px;font-size:14.5px;border-radius:8px}

.goal-rows{display:grid;gap:12px}
.goal-row{display:grid;gap:8px;padding:12px;border-radius:var(--r-sm);background:var(--sunk);border:1px solid var(--line)}
.goal-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.form-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;z-index:2;background:var(--bg);padding-block:12px;border-top:1px solid var(--line)}

.bars{display:grid;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:14px}

.bar-row .track{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar-row .track i{display:block;height:100%;background:var(--accent);border-radius:99px}

.sources a{font-weight:600;overflow-wrap:anywhere}
.sources span{font:500 11.5px/1 var(--f-mono);color:var(--faint)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none;margin-right:6px;vertical-align:1px}
.dot.ok{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.conns{display:grid;gap:8px}
.conn{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px}
.conn .dot{margin-top:6px}
.conn-b{display:grid;gap:6px;min-width:0}
.conn-b p{font-size:14px;color:var(--muted)}
.notice{display:grid;gap:8px;background:var(--accent-soft);border-radius:var(--r-sm);padding:14px}
.notice p{font-size:14px;color:var(--muted)}
h4.lk{font:500 11.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 8px}
textarea[readonly]{background:var(--sunk);font-family:var(--f-mono);font-size:13px}
.chk{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);font-size:14.5px;cursor:pointer}

.chk>span{display:grid;gap:2px;min-width:0}
.chk .sub{font-size:13px}
.chk-t{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.chk-t b{overflow-wrap:anywhere}
.gsteps{margin:0;padding:0;list-style:none;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.gsteps li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:6px;align-content:start}
.gsteps li b{font:650 15px/1.3 var(--f-display)}
.gsteps li span{font-size:13.5px;color:var(--muted)}
.gsteps li a{font-size:13.5px;font-weight:600;text-decoration:none}
.conflicts{background:color-mix(in srgb,var(--warn) 12%,transparent);border-radius:var(--r-sm);padding:10px 12px}
.conflicts h4{color:var(--warn)}
.fill{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:550;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){.toast{bottom:28px}}
.loading{display:grid;gap:12px;padding-top:30px}
.skel{height:64px;border-radius:var(--r);background:linear-gradient(90deg,var(--sunk),var(--surface),var(--sunk));background-size:200% 100%;animation:sk 1.4s ease infinite}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition:none!important}}

<script>
(() => {
'use strict';

/* ---------------- utilities ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const parseISO = s => { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };

const nowISO = () => new Date().toISOString();
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

const rel = iso => { if (!iso) return ''; const n = diffDays(today(), iso); if (n === 0) return 'today'; if (n === -1) return 'yesterday'; if (n === 1) return 'tomorrow'; return n < 0 ? `${-n} days ago` : `in ${n} days`; };
const timeAgo = ts => { if (!ts) return ''; const s = (Date.now() - new Date(ts).getTime()) / 1000; if (s < 90) return 'just now'; if (s < 3600) return Math.round(s / 60) + ' min ago'; if (s < 86400) return Math.round(s / 3600) + ' h ago'; return Math.round(s / 86400) + ' days ago'; };
const norm = s => String(s || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9@.\s]/g, ' ').replace(/\s+/g, ' ').trim();
const first = n => String(n || '').trim().split(/\s+/)[0] || '';

const splitList = s => String(s || '').split(/[,;\n]/).map(x => x.trim()).filter(Boolean);
const uniq = a => [...new Set(a)];
const clone = o => JSON.parse(JSON.stringify(o));
const hhmm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmtTime = t => { if (!t || !/^\d{1,2}:\d{2}/.test(t)) return ''; const [h, m] = t.split(':').map(Number); return `${((h + 11) % 12) + 1}:${pad(m)}${h >= 12 ? 'pm' : 'am'}`; };
const str = x => typeof x === 'string' ? x.trim() : (typeof x === 'number' ? String(x) : '');
const arr = (x, n = 8) => Array.isArray(x) ? x.map(v => typeof v === 'string' ? v.trim() : (v && typeof v === 'object' ? Object.values(v).filter(z => typeof z === 'string').join(' — ') : String(v ?? ''))).filter(Boolean).slice(0, n) : [];
const lc1 = s => s ? s.charAt(0).toLowerCase() + s.slice(1) : s;
const unesc = s => String(s || '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&');

const I = {
  today: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>',
  people: '<svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.6c2.6.2 4.4 1.9 5 4.9"/></svg>',
  discover: '<svg class="i" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M10.5 7.5v6M7.5 10.5h6"/></svg>',
  events: '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  me: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3"/></svg>',
};
const TABS = [['today','Today'],['people','People'],['discover','Discover'],['events','Events'],['me','Goals']];
const GOAL_TYPES = {capital:'Raise capital', clients:'Win clients', hiring:'Hire talent', market:'Enter a market', partners:'Find partners', mentors:'Find mentors', career:'Career move', other:'Other'};
const KIND = {meeting:'Meeting', conference:'Conference', mixer:'Mixer', dinner:'Dinner', meetup:'Meetup', community:'Community', other:'Event'};
const RECUR = {none:'One-off', weekly:'Weekly', biweekly:'Every 2 weeks', monthly:'Monthly', quarterly:'Quarterly', yearly:'Yearly'};
const TOUCH = {coffee:'Coffee', call:'Call', meeting:'Meeting', message:'Message', email:'Email', event:'At an event', other:'Other'};

/* ---------------- state ---------------- */
const S = {
  mode: 'loading', loaded: {contacts:false, events:false, profile:false, meta:false},
  profile: {name:'', headline:'', location:'', email:'', background:'', offerings:'', industries:[], goals:[]},
  contacts: new Map(), events: new Map(),
  meta: {searches:[], briefs:{}, radar:null, dismissed:{}},
  tab: 'today', briefMode: 'daily',
  peopleQ: '', peopleSort: 'priority', peopleFilter: 'all',
  discoverType: 'event', discoverQ: '', discoverCid: '', discoverCtx: '', discoverResult: null,
  busy: {}, err: {}, ctl: {},
  ai: null, aiState: 'pending', aiImages: false, aiTools: false, downloads: null, perms: null, mcp: null,
  web: {state: 'pending', schemas: null, lastOk: ''}, handoff: null, errFix: {},
  sheets: [], confirm: null, chat: null, ics: null, draft: null, importing: null, srcDraft: {},
};
const h0 = (location.hash || '').slice(1);
if (TABS.some(t => t[0] === h0)) S.tab = h0;

/* ---------------- storage ---------------- */
const LS_KEY = 'inroads.v1';
const DB = { refs: null };
const chains = {};
let localTimer = null;

function normProfile(p) { return {name:'', headline:'', location:'', email:'', background:'', offerings:'', industries:[], goals:[], ...(p || {})}; }
function normMeta(m) { return {searches:[], briefs:{}, radar:null, dismissed:{}, ...(m || {})}; }

function goLocal() {
  S.mode = 'local';
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      S.profile = normProfile(d.profile);
      S.meta = normMeta(d.meta);
      S.contacts = new Map((d.contacts || []).map(c => [c.id, c]));
      S.events = new Map((d.events || []).map(e => [e.id, e]));
    }
  } catch (e) { /* storage unavailable: keep in memory */ }
  for (const k in S.loaded) S.loaded[k] = true;
}
function saveLocalSoon() {
  clearTimeout(localTimer);
  localTimer = setTimeout(() => {
    try { localStorage.setItem(LS_KEY, JSON.stringify({profile:S.profile, meta:S.meta, contacts:[...S.contacts.values()], events:[...S.events.values()]})); }
    catch (e) { toast('This browser is out of storage space. Export a backup, then remove old records.'); }
  }, 250);
}
async function retry(fn) {
  for (let i = 0; ; i++) {
    try { return await fn(); }
    catch (e) {
      const c = e && e.code;
      if ((c === 'resource_exhausted' && i < 4) || (c === 'unavailable' && i < 1)) { await sleep(700 * (i + 1) + Math.random() * 500); continue; }
      throw e;
    }
  }
}
function dbFail(e) {
  const c = e && e.code;
  if (c === 'quota_exceeded') toast('Your Inroads storage is full. Delete people or events you no longer need, then try again.');
  else if (c === 'revoked') { S.mode = 'revoked'; render(); }
  else toast("Couldn't save that change. Check your connection and try again.");
}
function write(key, fn) {
  if (S.mode !== 'cloud') { saveLocalSoon(); return Promise.resolve(true); }
  const p = (chains[key] || Promise.resolve()).then(() => retry(fn));
  chains[key] = p.catch(() => {});
  return p.then(() => true, e => { dbFail(e); return false; });
}
function putContact(c, o = {}) {
  c.updatedAt = nowISO();
  S.contacts.set(c.id, c);
  if (!o.quiet) render();
  const body = clone(c);
  return write('c/' + c.id, () => DB.refs.contacts.doc(c.id).set(body));
}
function delContact(id) { S.contacts.delete(id); render(); return write('c/' + id, () => DB.refs.contacts.doc(id).delete()); }
function putEvent(e, o = {}) {
  e.updatedAt = nowISO();
  S.events.set(e.id, e);
  if (!o.quiet) render();
  const body = clone(e);
  return write('e/' + e.id, () => DB.refs.events.doc(e.id).set(body));
}
function delEvent(id) { S.events.delete(id); render(); return write('e/' + id, () => DB.refs.events.doc(id).delete()); }
function setProfile(p) { S.profile = normProfile(p); render(); const body = clone(S.profile); return write('profile', () => DB.refs.profile.set(body)); }
let metaQueued = false;
function saveMeta() {
  render();
  if (S.mode !== 'cloud') { saveLocalSoon(); return; }
  if (metaQueued) return;
  metaQueued = true;
  write('meta', () => { metaQueued = false; return DB.refs.meta.set(clone(S.meta)); });
}

async function initStore() {
  const C = window.claude;
  if (!C || typeof C.use !== 'function') {
    // Standalone fallback: plain browser download so backups still work off claude.ai
    S.downloads = {save: async ({filename, data}) => {
      const url = URL.createObjectURL(new Blob([data], {type: 'application/json'}));
      const a = Object.assign(document.createElement('a'), {href: url, download: filename});
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }};
    goLocal(); S.aiState = 'off'; S.web.state = 'off'; render(); return;
  }
  const permsP = C.use('permissions').then(p => (S.perms = p)).catch(() => null);

    S.ai = s;
    if (s && typeof s.limits === 'function') { try { const l = await s.limits(); S.aiImages = !!(l && l.images); S.aiTools = !!(l && l.tools); } catch (e) {} }

    const st = s && p ? await p.state('sample').catch(() => 'prompt') : 'prompt';
    S.aiState = !s ? 'off' : st === 'denied' ? 'denied' : 'ready';
    render();
  }).catch(() => { S.aiState = 'off'; render(); });
  C.use('mcp').then(async m => { S.mcp = m; await permsP; await checkWeb(); render(); }).catch(() => { S.web.state = 'off'; render(); });

  try { [db, user] = await Promise.all([C.use('db'), C.use('user')]); } catch (e) {}

  const base = db.doc(`data/users/${uid}/crm`);
  DB.refs = {
    contacts: base.collection('contacts'), events: base.collection('events'),

function buildNudges() {
  const t = today(), out = [], dis = S.meta.dismissed || {};
  const soon = new Set(); for (const {e} of upcoming(t, addDays(t, 3))) (e.contactIds || []).forEach(id => soon.add(id));
  for (const c of contactsArr()) {
    const nm = esc(first(c.name) || c.name);
    const b = bdayNext(c);
    if (b) { const n = diffDays(t, b); if (n >= 0 && n <= 7) { const key = `bday:${c.id}:${b}`; out.push({key, kind:'birthday', p: n === 0 ? 0 : 3, c, label:'Birthday', title:`${esc(c.name)}'s birthday is ${n === 0 ? 'today' : n === 1 ? 'tomorrow' : 'in ' + n + ' days'}`, body:`${esc(fmtDate(b, {dow:true}))}. A short, specific note lands better than a generic one.`, actions: aiAct('draft', 'Draft a note', {id:c.id, purpose:'birthday'}, 'primary') + act('dismiss', 'Done', {key})}); } }
    for (const p of c.commitments || []) {
      if (p.done || p.owner === 'them') continue;
      const n = p.due ? diffDays(t, p.due) : null;
      if (n != null && n > 3) continue;
      out.push({key:`p:${c.id}:${p.id}`, kind:'promise', p: n != null && n < 0 ? 0 : 1, c, label: n != null && n < 0 ? 'Overdue promise' : 'Promise', title:`You said you'd ${esc(lc1(p.text))}`, body:`For ${esc(c.name)}${p.due ? ` · due ${esc(rel(p.due))}` : ''}.`, actions: act('promise-done', 'Mark done', {id:c.id, pid:p.id}, 'primary') + act('open-contact', 'Open', {id:c.id})});
    }
    if (isCooling(c) && (c.starred || (scoreOf(c) ?? 50) >= 40)) {
      const w = warmth(c);
      out.push({key:`cold:${c.id}`, kind:'cold', p:2, c, label:'Going cold', title:`${w.d} days since you spoke with ${nm}`, body:`${esc(roleLine(c))}. For someone this important you aim to touch base every ${cadence(c)} days.`, actions: aiAct('draft', 'Draft message', {id:c.id, purpose:'checkin'}, 'primary') + act('log-touch', 'Log a touch', {id:c.id}) + act('snooze', 'Snooze', {key:`cold:${c.id}`, days:14}, 'quiet')});
    }
    if (!c.dossier && (soon.has(c.id) || c.starred || (scoreOf(c) ?? 0) >= 70)) {
      out.push({key:`res:${c.id}`, kind:'research', p: soon.has(c.id) ? 1 : 4, c, label: soon.has(c.id) ? 'Prep' : 'Research', title: soon.has(c.id) ? `You meet ${nm} soon and have no dossier` : `${nm} is high priority with no dossier`, body:'One tap pulls together their background, talking points and a goal-fit score.', actions: aiAct('research', 'Research now', {id:c.id}, 'primary') + act('snooze', 'Later', {key:`res:${c.id}`, days:7}, 'quiet')});
    }
    if (needsContext(c) && !c.imported && c.createdAt && diffDays(c.createdAt.slice(0, 10), t) <= 14) {
      const miss = [!c.whereMet && 'where you met', !(c.interests || []).length && 'their interests'].filter(Boolean).join(' and ');
      out.push({key:`ctx:${c.id}`, kind:'context', p:5, c, label:'Add context', title:`What do you remember about ${nm}?`, body:`Capture ${miss} while it's fresh.`, actions: act('edit-contact', 'Add context', {id:c.id}, 'primary') + act('snooze', 'Later', {key:`ctx:${c.id}`, days:3}, 'quiet')});
    }
  }
  for (const {e, date} of upcoming(addDays(t, 1), addDays(t, 7))) {
    if (e.kind === 'meeting') continue;
    out.push({key:`ev:${e.id}:${date}`, kind:'event', p:3, label:'This week', title: esc(e.title), body:`${esc(fmtDate(date, {dow:true}))}${e.time ? ' · ' + fmtTime(e.time) : ''}${e.location ? ' · ' + esc(e.location) : ''}`, actions: aiAct('decode', 'Decode the room', {q:e.title, type:'event'}, 'primary') + act('open-event', 'Open', {id:e.id})});
  }
  return out.filter(n => !(dis[n.key] && dis[n.key] >= t)).sort((a, b) => a.p - b.p).slice(0, 14);
}

function connRows(compact) {

    pending: ['', 'Connecting to Claude…', 'This takes a few seconds after the page opens.', ''],
    denied: ['bad', 'Claude is turned off for this page', "The permission was declined. Turn Claude back on in this page's permissions. Until then, AI buttons give you a request to paste into a Claude chat.", S.perms ? act('open-perms', 'Open permissions', {}, 'primary') : ''],

  }[S.aiState] || ['', 'Checking Claude…', '', ''];
  const toolsMissing = S.aiState === 'ready' && !S.aiTools;
  const WEB = toolsMissing ? ['warn', 'Live web needs a newer Claude app', 'This view can\'t give Claude web tools, so research uses Claude\'s knowledge. Open Inroads on claude.ai or update the app.', ''] : ({
    ready: ['ok', 'Live web search is connected', `Research, Decode, Radar and the daily brief search the web through ${WEB_SERVER} and list the pages they used.${S.web.lastOk ? ' Last search ' + timeAgo(S.web.lastOk) + '.' : ''}`, ''],

  }[S.web.state] || ['', '…', '', '']);
  const SYNC = {cloud: ['ok', 'Synced to your Claude account', 'Private to you. People you share this page with never see your network.'], local: ['warn', 'Saved on this device only', 'Open Inroads from claude.ai or the Claude app to sync to your account. Download a backup to move your data.'], revoked: ['bad', 'Sync stopped', 'Reload the page to reconnect.'], loading: ['', 'Connecting…', '']}[S.mode] || ['', '', ''];

const WEB_SERVER = 'Parallel Search';
const WEB_TOOLS = ['web_search', 'web_fetch'];
const WEB_SESSION = Array.from({length: 32}, () => '0123456789abcdef'[Math.floor(Math.random() * 16)]).join('');
const isUrl = u => /^https?:\/\/\S+$/i.test(String(u || '').trim());
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };
function cleanSources(x) {

    if (!isUrl(url) || seen.has(url)) continue;

    out.push({url, title: (s && typeof s === 'object' && str(s.title)) || hostOf(url)});
  }
  return out.slice(0, 12);
}

function parseLooseJSON(s) {
  s = String(s || '').trim();
  const tryP = x => { try { return JSON.parse(x); } catch (e) { return undefined; } };
  let v = tryP(s); if (v !== undefined) return v;
  const f = s.match(/```(?:json)?\s*([\s\S]*?)```/i); if (f) { v = tryP(f[1].trim()); if (v !== undefined) return v; }
  const a = s.search(/[[{]/), b = Math.max(s.lastIndexOf('}'), s.lastIndexOf(']'));
  if (a >= 0 && b > a) return tryP(s.slice(a, b + 1));
  return undefined;
}
function fitSchema(s) {
  if (!s || typeof s !== 'object' || Array.isArray(s)) return null;
  let o = clone(s);
  if (o.type !== 'object') return null;
  const strip = x => { if (Array.isArray(x)) x.forEach(strip); else if (x && typeof x === 'object') { delete x.description; delete x.examples; delete x.title; Object.values(x).forEach(strip); } };
  if (JSON.stringify(o).length > 3900) strip(o);
  return JSON.stringify(o).length <= 3900 ? o : null;
}
function clipResult(r) {
  let p = r && (r.payload !== undefined ? r.payload : (r.content || []).map(c => c.text || '').join('\n'));
  if (p && typeof p === 'object' && Array.isArray(p.results)) {
    const per = Math.max(500, Math.floor(11000 / Math.max(1, Math.min(12, p.results.length))));
    p = {results: p.results.slice(0, 12).map(x => ({url: x.url, title: x.title, published: x.publish_date || undefined, excerpts: (Array.isArray(x.excerpts) ? x.excerpts.join(' … ') : String(x.excerpts || x.content || x.full_content || '')).slice(0, per)}))};
  }
  const s = typeof p === 'string' ? p : JSON.stringify(p);
  return s && s.length > 12000 ? s.slice(0, 12000) + ' …[truncated]' : (s || '(no results)');
}
function describeInput(input) {
  if (!input || typeof input !== 'object') return '';
  const pick = [input.query, input.objective, Array.isArray(input.search_queries) && input.search_queries[0], Array.isArray(input.queries) && input.queries[0], input.url, Array.isArray(input.urls) && input.urls[0]].find(v => typeof v === 'string' && v.trim());
  if (!pick) return '';
  const v = isUrl(pick) ? hostOf(pick) : pick.trim();
  return '“' + (v.length > 60 ? v.slice(0, 57) + '…' : v) + '”';
}

async function checkWeb() {
  const m = S.mcp;
  if (!m) { S.web.state = 'off'; return; }
  try {
    const r = await m.listTools(WEB_SERVER);
    const sv = ((r && r.servers) || []).find(x => x.server === WEB_SERVER);
    if (!sv || !(sv.tools || []).length) { S.web.state = 'missing'; return; }
    if (sv.authStatus === 'needs_reauth') { S.web.state = 'reauth'; return; }
    const st = S.perms ? await S.perms.state('mcp:' + WEB_SERVER).catch(() => 'prompt') : 'prompt';
    S.web.state = st === 'denied' ? 'denied' : 'ready';
  } catch (e) {
    const c = e && e.code;
    S.web.state = c === 'server_not_connected' || c === 'selection_required' ? 'missing' : c === 'needs_reauth' ? 'reauth' : 'off';
  }
}
async function webTools(step) {
  if (!S.mcp || !S.aiTools) return null;
  if (S.web.state === 'pending') await checkWeb();
  if (S.web.state !== 'ready') return null;
  if (!S.web.schemas) {
    step('Connecting to live web search');
    if (S.perms) {
      const r = await S.perms.request(['mcp:' + WEB_SERVER]).catch(() => null);
      if (r && r['mcp:' + WEB_SERVER] === 'denied') { S.web.state = 'denied'; return null; }
    }
    const sch = {};
    for (const t of WEB_TOOLS) {
      try { const d = await S.mcp.describeTool(WEB_SERVER, t); sch[t] = {schema: fitSchema(d && d.inputSchema), desc: str(d && d.description)}; }
      catch (e) { sch[t] = {schema: null, desc: ''}; }
    }
    S.web.schemas = sch;
  }
  const FALLBACK = {
    web_search: 'Search the live web and get result titles, URLs and excerpts. Pass the arguments this search tool documents (for Parallel Search: an "objective" sentence and a "search_queries" list). If it reports an argument error, read the error and call it again correctly.',
    web_fetch: 'Fetch the readable text of web pages by URL. Pass the arguments this tool documents (for Parallel Search: a "urls" list, optionally an "objective"). If it reports an argument error, read the error and call it again correctly.',
  };
  return WEB_TOOLS.map(t => ({
    name: t,
    description: (S.web.schemas[t].desc || FALLBACK[t]).slice(0, 1000),
    inputSchema: S.web.schemas[t].schema || {type: 'object', properties: {}, additionalProperties: true},
    execute: async (input, ctx) => {
      step(t === 'web_search' ? 'Searching the web' : 'Reading', input);
      try {
        const props = (S.web.schemas[t].schema || {}).properties || {};
        if (input && typeof input === 'object' && props.session_id && !input.session_id) input = {...input, session_id: WEB_SESSION};
        const r = await S.mcp.callTool(WEB_SERVER, t, input, {signal: ctx.signal});
        S.web.lastOk = nowISO();
        return clipResult(r);
      } catch (e) {
        const c = e && e.code;
        if (c === 'not_in_manifest') S.web.state = 'denied';
        else if (c === 'server_not_connected') S.web.state = 'missing';
        else if (c === 'needs_reauth') S.web.state = 'reauth';
        throw new Error(c === 'tool_error' ? 'The tool rejected that call: ' + String(e.message || '').slice(0, 500) : `Web search is unavailable right now (${c || 'error'}). Answer from what you have.`);
      }
    },
  }));
}
function webRules(mode, what) {

function parseChat(raw) {
  raw = String(raw || '').replace(/[‎‏‪-‮﻿]/g, '').replace(/[  ]/g, ' ');
  if (/^\s*\{/.test(raw)) {
    try {
      const j = JSON.parse(raw);
      const ms = (j.messages || []).filter(m => m && m.type === 'message' && m.from);
      if (ms.length) return finishChat(ms.map(m => ({date: String(m.date || '').slice(0, 10), sender: String(m.from), text: Array.isArray(m.text) ? m.text.map(p => typeof p === 'string' ? p : (p && p.text) || '').join('') : String(m.text || '')})));

    if (m) rows.push({a: +m[1], b: +m[2], c: +m[3], sender: m[7].replace(/^~\s*/, '').trim(), text: m[8]});
    else if (rows.length && l.trim()) rows[rows.length - 1].text += '\n' + l;
  }
  if (rows.length < 2) return {msgs: [], participants: [], plain: true};
  let dmy = true;
  if (rows.some(r => r.a <= 12 && r.b > 12)) dmy = false;
  if (rows.some(r => r.a > 12 && r.a <= 31)) dmy = true;
  const msgs = rows.map(r => {
    let y, mo, d;
    if (r.a > 31) { y = r.a; mo = r.b; d = r.c; } else if (dmy) { d = r.a; mo = r.b; y = r.c; } else { mo = r.a; d = r.b; y = r.c; }
    if (y < 100) y += 2000;
    return {date: `${y}-${pad(mo)}-${pad(d)}`, sender: r.sender, text: r.text};
  });
  return finishChat(msgs);
}
function finishChat(msgs) {

  const participants = Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([name, n]) => ({name, n}));
  const dates = msgs.map(m => m.date).filter(isISO).sort();
  return {msgs, participants, from: dates[0], to: dates[dates.length - 1], plain: false};
}

function pickFile(accept, cb, o = {}) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = accept; if (o.multiple) inp.multiple = true;
  inp.style.cssText = 'position:fixed;left:-1000px;top:0;width:1px;height:1px;opacity:0';
  document.body.appendChild(inp);
  const done = () => setTimeout(() => inp.remove(), 0);
  inp.addEventListener('cancel', done);
  inp.addEventListener('change', async () => {
    const files = [...(inp.files || [])]; done();
    if (!files.length) return;
    if (o.multiple) { cb(files); return; }
    const f = files[0];
    if (o.text) { let t = null; try { t = await f.text(); } catch (e) {} if (t == null) { toast("Couldn't read that file."); return; } cb(t, f); }
    else cb(f);
  });
  inp.click();
}

async function runImport() {

  if (!useContacts && !cals.length) { toast('Tick contacts or at least one calendar to import.'); return; }
  p.running = true; renderSheet(true);
  const me = uniq(splitList(p.meText || '').map(x => x.toLowerCase()).filter(x => x.includes('@')));
  if (me.length) {
    const cur = splitList(S.profile.email).map(x => x.toLowerCase()), add = me.filter(x => !cur.includes(x));

      const adds = plan.adds.slice(0, 2000);
      more = plan.adds.length - adds.length;

    p.running = false; S.importing = null; renderSheet(true); render(); return;
  }
  S.importing = null; S.imp = null;
  S.sheets = S.sheets.filter(s => !String(s.key).startsWith('imp:'));

}
async function importCalendars(cals, opts) {
  const evs = cals.flatMap(c => c.events);

  const mine = new Set(opts.me || []);
  const {byEmail, byName} = contactIndex();
  const idByEmail = new Map([...byEmail].map(([e, c]) => [e, c.id])), idByName = new Map([...byName].map(([k, c]) => [k, c.id]));
  const byUid = new Map(); for (const e of S.events.values()) if (e.calUid) byUid.set(e.calUid, e);
  const touched = new Map(), newPeople = new Map(), evWrites = new Map();
  let logged = 0, skipped = 0, evNew = 0, evUpd = 0;
  for (const ev of evs) {
    if (/CANCELLED/i.test(ev.status || '') || ev.isException) { skipped++; continue; }
    const meAtt = ev.attendees.find(a => a.email && mine.has(a.email) && a.role === 'ATTENDEE');
    if (meAtt && meAtt.status === 'DECLINED') { skipped++; continue; }
    const rec = rruleToRecur(ev.rrule, ev.start.date);
    const seen = new Set();
    const others = ev.attendees.filter(a => { if (a.resource) return false; const k = a.email || norm(a.name); if (!k || seen.has(k) || (a.email && mine.has(a.email))) return false; seen.add(k); return true; });
    const ids = uniq(others.map(a => (a.email && idByEmail.get(a.email)) || (a.name && idByName.get(norm(a.name)))).filter(Boolean));
    const series = {date: ev.start.date, ...rec};
    const pastDates = occurrences(series, past, addDays(t, -1));
    const nextDates = occurrences(series, t, fut);
    if (!pastDates.length && !nextDates.length) { skipped++; continue; }
    const keyOf = d => `cal:${ev.uid || norm(ev.summary)}:${d}`;
    for (const d of pastDates) for (const id of ids) {
      const c = touched.get(id) || clone(S.contacts.get(id));
      if ((c.interactions || []).some(i => i.key === keyOf(d))) continue;
      c.interactions = [{id: newId(), date: d, type: 'meeting', summary: ev.summary || 'Meeting', source: 'calendar', key: keyOf(d)}, ...(c.interactions || [])].slice(0, 150);
      touched.set(id, c); logged++;
    }
    if (pastDates.length) for (const a of others) {
      if (!a.email || idByEmail.has(a.email) || (a.name && idByName.has(norm(a.name)))) continue;
      const np = newPeople.get(a.email) || {name: a.name || a.email.split('@')[0], email: a.email, count: 0, first: ev.summary || '', meetings: []};
      np.count += pastDates.length;
      for (const d of pastDates.slice(-5)) if (np.meetings.length < 20) np.meetings.push({date: d, summary: ev.summary || 'Meeting', key: keyOf(d)});
      newPeople.set(a.email, np);
    }
    if (nextDates.length && (others.length || opts.includeSolo)) {
      const ex = ev.uid && (byUid.get(ev.uid) || evWrites.get(ev.uid));
      if (!evWrites.has(ev.uid || '')) { if (ex) evUpd++; else evNew++; }
      const went = meAtt ? meAtt.status === 'ACCEPTED' : ev.attendees.some(a => a.role === 'ORGANIZER' && mine.has(a.email));
      const attended = {...(ex?.attended || {})};
      if (went && rec.recur !== 'none') for (const d of pastDates) if (attended[d] === undefined) attended[d] = true;
      const e = {...(ex || {}), id: ex?.id || newId(), title: ev.summary || 'Meeting', date: ev.start.date, time: ev.start.time || '', location: ev.location || '', kind: ex?.kind || (others.length ? 'meeting' : 'other'), recur: rec.recur, until: rec.until || '', byDays: rec.byDays || null, nth: rec.nth || null, notes: ex?.notes || ev.desc || '', contactIds: uniq([...(ex?.contactIds || []), ...ids]), attended, goalId: ex?.goalId || '', source: 'calendar', calUid: ev.uid || '', createdAt: ex?.createdAt || nowISO()};
      evWrites.set(ev.uid || e.id, e);
    } else if (!pastDates.length) skipped++;

  const evList = [...evWrites.values()].slice(0, 500);
  const cWrites = [...touched.values()].map(c => { const lt = lastTouch(c); if (lt > (c.lastContact || '')) c.lastContact = lt; return c; });
  S.importing = {done: 0, total: evList.length + cWrites.length}; render();
  await bulk([...cWrites.map(c => ['c', c]), ...evList.map(e => ['e', e])], ([k, o]) => (k === 'c' ? putContact(o, {quiet: true}) : putEvent(o, {quiet: true})));
  return {logged, people: touched.size, upcoming: evList.length, evNew, evUpd, skipped, newPeople: [...newPeople.values()].sort((a, b) => b.count - a.count).slice(0, 60)};
}

  copy: (d, el) => copyText(d.text != null ? d.text : ($(d.src)?.value || ''), el),
  'promise-toggle': d => { const c = S.contacts.get(d.id); if (!c) return; const n = clone(c); n.commitments = (n.commitments || []).map(p => p.id === d.pid ? {...p, done: !p.done} : p); putContact(n); renderSheet(true); },
  'promise-done': d => { const c = S.contacts.get(d.id); if (!c) return; const n = clone(c); n.commitments = (n.commitments || []).map(p => p.id === d.pid ? {...p, done: true} : p); putContact(n); toast('Marked done.'); },
  snooze: d => { S.meta.dismissed = {...(S.meta.dismissed || {}), [d.key]: addDays(today(), +d.days || 7)}; saveMeta(); },
  dismiss: d => { S.meta.dismissed = {...(S.meta.dismissed || {}), [d.key]: '9999-12-31'}; saveMeta(); },
  'open-event': d => openEvent(d.id),
  'add-event': d => openEventForm(null, d.date ? {date: d.date} : {}),
  'edit-event': d => openEventForm(d.id),
  attend: d => { const e = S.events.get(d.id); if (!e) return; const n = clone(e); n.attended = {...(n.attended || {}), [d.date]: !(n.attended || {})[d.date]}; putEvent(n); renderSheet(true); },
  decode: d => { S.tab = 'discover'; S.discoverCid = d.cid || ''; S.discoverQ = d.q || ''; S.discoverType = d.type || 'event'; S.discoverResult = null; S.sheets = []; renderSheet(true); render(); window.scrollTo(0, 0); runDiscover(); },
  'open-search': d => { const s = (S.meta.searches || []).find(x => x.id === d.id); if (!s) return; S.tab = 'discover'; S.discoverResult = s.result; S.discoverQ = s.q; S.discoverType = s.type; render(); window.scrollTo(0, 0); },
  'save-stakeholder': d => { const r = S.discoverResult, s = r && r.stakeholders[+d.i]; if (!s) return; openContactForm(null, {name: s.name, position: s.role, notes: s.why, whereMet: '', tags: [], opportunities: '', company: r.kind === 'company' ? r.title : ''}); },
  'event-from-discover': () => { const r = S.discoverResult; if (!r) return; openEventForm(null, {title: r.title, kind: 'conference', notes: r.overview}); },
  'radar-add': d => { const x = S.meta.radar?.items?.[+d.i]; if (!x) return; openEventForm(null, {title: x.title, date: x.date || '', time: x.time || '', url: x.url || '', kind: KIND[x.kind] ? x.kind : (x.kind === 'host-your-own' ? 'dinner' : 'other'), location: x.where, notes: [x.date ? '' : x.timing, x.why, !x.date && x.howToFind ? 'Find the date: ' + x.howToFind : ''].filter(Boolean).join('\n')}); },
  radar: () => refreshRadar(),
  'write-brief': d => writeBrief(d.kind),
  'score-batch': () => scoreBatch(),
  'edit-profile': () => openProfileForm(),
  'goal-row-add': (d, el) => { el.closest('form').querySelector('.goal-rows').insertAdjacentHTML('beforeend', goalRow({})); },
  'goal-row-del': (d, el) => { el.closest('.goal-row').remove(); },
  'import-google': () => pickFile('.zip,.csv,.vcf,.vcard,.ics,application/zip,text/csv,text/vcard,text/x-vcard,text/calendar', files => startImport(files), {multiple: true}),
  'import-contacts': () => pickFile('.vcf,.vcard,.csv,.zip,text/vcard,text/x-vcard,text/csv,application/zip', files => startImport(files), {multiple: true}),
  'import-ics': () => pickFile('.ics,.zip,text/calendar,application/zip', files => startImport(files), {multiple: true}),
  'imp-run': () => runImport(),
  'import-chat': d => openChatImport(d.id || ''),
  'chat-file': () => pickFile('.txt,.json,text/plain,application/json', (text, f) => { S.chat.raw = text; S.chat.fileName = f.name; chatRead(); }, {text: true}),
  'chat-read': () => chatRead(),
  'chat-extract': () => chatExtract(),
  'chat-apply': () => chatApply(),
  'chat-reset': () => { const t = S.chat?.target && S.chat.target !== '__new' ? S.chat.target : ''; S.chat = {step: 'input', raw: '', fileName: '', parsed: null, me: '', target: t, newName: '', result: null}; renderSheet(true); },
  'ics-add': d => { const p = S.ics?.newPeople?.[+d.i]; const c = addCalendarPerson(p); if (!c) return; render(); renderSheet(true); toast(`${first(p.name)} added.`); },
  'ics-add-all': async () => { const list = (S.ics?.newPeople || []).filter(p => !p.added); if (!list.length) return; list.forEach(addCalendarPerson); render(); renderSheet(true); toast(`Added ${list.length} ${list.length === 1 ? 'person' : 'people'}.`); },
  'scan-card': () => scanCard(),
  connections: () => openConnections(),
  'open-perms': () => openPerms(),
  'retry-handoff': () => retryHandoff(),
  'handoff-apply': () => applyHandoff(),
  'check-web': async () => { S.web.state = 'pending'; S.web.schemas = null; renderSheet(true); render(); await checkWeb(); render(); renderSheet(true); toast(S.web.state === 'ready' ? 'Live web search is connected.' : 'Live web search still isn\'t connected.'); },
  'allow-web': async () => { if (!S.perms) return; const r = await S.perms.request(['mcp:' + WEB_SERVER]).catch(() => null); await checkWeb(); render(); renderSheet(true); if (r && r['mcp:' + WEB_SERVER] === 'denied') toast('Live web search is off for this page. Use Open permissions to turn it on.'); },
  'save-found': d => { const c = S.contacts.get(d.id); if (!c || !c.dossier) return; const items = dossierFill(c, c.dossier); if (!items.length) { toast('Nothing new to add.'); return; } const n = clone(c); n.socials = {...(n.socials || {})}; for (const it of items) { if (it.k.startsWith('s:')) n.socials[it.k.slice(2)] = it.value; else n[it.k] = it.value; } putContact(n); renderSheet(true); toast(`Added ${items.length} detail${items.length === 1 ? '' : 's'} to ${first(c.name)}'s profile.`); },
  'save-profiles': d => { const c = S.contacts.get(d.id); if (!c || !c.dossier) return; const n = clone(c); n.socials = {...(n.socials || {})}; let k = 0; for (const [key, u] of Object.entries(c.dossier.profiles || {})) if (isUrl(u) && !n.socials[key]) { n.socials[key] = u; k++; } putContact(n); renderSheet(true); toast(k ? `Saved ${k} profile link${k === 1 ? '' : 's'}.` : 'Nothing new to save.'); },
  export: () => exportBackup(),
  restore: () => restoreBackup(),
  'load-examples': () => loadExamples(),
  'remove-examples': () => removeExamples(),
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset, el, e); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.bind) {
    setPath(el.dataset.bind, el.value);
    if (el.dataset.bind === 'discoverQ') S.discoverCid = '';
    if (el.dataset.bind === 'peopleQ') { const l = $('#people-list'); if (l) l.innerHTML = peopleList(); }
  }
  if (el.dataset.filter) {
    const q = norm(el.value), box = document.getElementById(el.dataset.filter);
    if (box) box.querySelectorAll('label').forEach(l => { l.hidden = !!q && !String(l.dataset.name || '').includes(q); });
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.type === 'checkbox' && el.dataset.check) { setPath(el.dataset.check, el.checked); renderSheet(true); return; }
  if (el.tagName === 'SELECT' && el.dataset.bind) {
    setPath(el.dataset.bind, el.value);
    if (el.dataset.bind === 'peopleSort') { const l = $('#people-list'); if (l) l.innerHTML = peopleList(); }
    if (el.dataset.bind.startsWith('chat.')) { el.blur(); renderSheet(true); }
  }
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.dataset && f.dataset.form && FORMS[f.dataset.form]) { e.preventDefault(); FORMS[f.dataset.form](new FormData(f), f); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.sheets.length) popSheet();
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.filter) e.preventDefault();
});

render();
initStore();
})();
</script>

</body></html>
